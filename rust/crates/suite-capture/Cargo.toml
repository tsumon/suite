[package]
name = "suite-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Screen capture, multi-monitor cropping, annotation drawing, Windows clipboard, WinRT OCR, history, and scroll stitch."

[dependencies]
suite-contracts.workspace = true
suite-platform.workspace = true
chrono.workspace = true
png.workspace = true
windows-core.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
